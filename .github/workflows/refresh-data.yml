name: Refresh Stock Data

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6am UTC
  workflow_dispatch:

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # We need to fetch the repo with write access to push back
          persist-credentials: false  # Otherwise, we might get a 403 when pushing
          fetch-depth: 0  # Fetch all history for potential commit signing

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'  # Matching the project's Python version

      - name: Create and activate virtual environment
        run: |
          python -m venv venv

      - name: Install dependencies
        run: |
          venv/bin/pip install -r requirements.txt

      - name: Run data fetch script
        run: |
          venv/bin/python fetch_stock.py

      - name: Generate predictions
        run: |
          venv/bin/python generate_predictions.py

      - name: Check for changes in data files
        id: git_check
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          CHANGED=false
          if ! git diff --quiet data.json; then
            echo "data.json has changed"
            CHANGED=true
          fi
          if ! git diff --quiet predictions.json; then
            echo "predictions.json has changed"
            CHANGED=true
          fi
          if [ "$CHANGED" = "false" ]; then
            echo "No changes in data files"
          fi
          echo "changed=$CHANGED" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.git_check.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git fetch origin
          git rebase origin/main
          git add data.json predictions.json
          git commit -m "Refresh stock data and predictions: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push origin HEAD:main